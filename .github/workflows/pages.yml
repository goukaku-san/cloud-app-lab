name: Deploy to GitHub Pages

# オーナーの決定（2026-10-30 夜）「まだ早い。他の人が遊べる状態にしない」により、
# 公開 URL https://<owner>.github.io/<repo>/ には holding/（「準備中」の 1 枚）だけを配信する。
# ゲーム本体（out/）は配信しない。本体を配信するにはオーナーの言葉が要る。
# 本体を配信していた版（npm ci → Build (sub-path) → upload path: out）は履歴 c4cbbf5 以前にある。
# 作業ブランチからの配信は github-pages 環境の保護ルールではじかれるため、main への push だけが対象。
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: holding

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
