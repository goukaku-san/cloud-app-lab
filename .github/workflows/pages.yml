name: Deploy to GitHub Pages

# 静的書き出し（out/）を GitHub Pages に配信する。
# 配信先: https://<owner>.github.io/<repo>/ （サブパス配信のため NEXT_PUBLIC_BASE_PATH を付けてビルド）
# オーナーの判断（2026-10-30、リポジトリを公開に変更）により、このブランチへの push ごとに配信する。
# 注意: 非公開リポジトリで Pages を使うには GitHub の有料プランが必要（または リポジトリを公開にする）。
on:
  push:
    branches: ["ccr-6493d86a-e9ceuo"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build (sub-path)
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
